<!--
    connexion.html — Page de connexion
-->
{% extends "base.html" %}

{% block titre %}Connexion — AdReward{% endblock %}

{% block contenu %}
<div class="container">
    <div class="card">
        <h1>Se connecter</h1>

        {% if erreur %}
        <div class="erreur">{{ erreur }}</div>
        {% endif %}

        <form method="POST" action="/connexion">
            <input
                type="email"
                name="email"
                placeholder="Ton adresse email"
                required
            >
            <input
                type="password"
                name="mot_de_passe"
                placeholder="Ton mot de passe"
                required
            >
            <button type="submit" class="btn">Se connecter</button>
        </form>

        <div class="lien-secondaire">
            Pas encore de compte ? <a href="/inscription">S'inscrire</a>
        </div>
    </div>
</div>
{% endblock %}
